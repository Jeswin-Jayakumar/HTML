<!DOCTYPE html>
<html>
    <head>
        <title>My Methods</title>
    </head>
    <body>
        <h1>Methods</h1>
        <script>
            var str1 = "codingal"
            var str2 = "I am codingal"
            document.writeln(str1.toUpperCase()+"<br>")
            document.writeln(str2.toLowerCase()+"<br>")
            document.writeln(str2.startsWith("c")+"<br>")
            str3 = "I Learn about Methods"
            pat = new RegExp("about")
            document.write(pat.test(str3))
        </script>
    </body>
</html>
