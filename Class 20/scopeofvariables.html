    <h1>Scope of Variables</h1>
    <button onclick = "scope()">Click</button>
    <div id="result"></div>
        <div id="result1"></div>
            <div id="result2"></div>
<script>
    var a = 10
    function scope(){
        var b = 7
        document.getElementById("result").innerHTML = "The result of two value is "+ (a*b)
    }
    document.getElementById("result1").innerHTML = "The result of value a is "+ a
    document.getElementById("result2").innerHTML = "The result of value b is "+ b
</script>
