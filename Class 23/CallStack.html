<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Stack</title>
</head>
<body>
    <h1>Call Stack</h1>
    <p>The call stack works under the Last In First Out (LIFO) operation</p>
    <div id="out"></div>
    <script>
        function add(a,b)
        {
            return a + b
        }
        function avg(a,b)
        {
            return add(a,b)/2
        }
        document.getElementById("out").innerHTML = "the average is "+avg(20,13)
    </script>
</body>
</html>
