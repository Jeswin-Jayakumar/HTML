<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Magic World Lab</h1>
    <p>Discover types, switch them, find and swap words</p>
    <h3>What Type Is It?</h3>
    <button class="btn btn-warning" onclick="checkTypes()">Reveal the Types!</button>
    <div id="typeResult">Press the button to reveal the secret types!</div>
    <h3>Switch the Type</h3>
    <input id="numIn" placeholder="Type any number here">
    <button onclick="toStr()">Turn into Text</button>
    <button onclick="toNum()">Turn into Number</button>
    <div id="convResult">Type a number above then press a button!</div>
</body>
</html>
