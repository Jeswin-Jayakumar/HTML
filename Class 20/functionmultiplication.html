<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function Multiplication</h1>
    <button onclick = "mul(5)">click me</button>
    <div id = "result"></div>
    <script>
        function mul(x,y){
            if (y == undefined){
                y = 2
            }
            document.getElementById("result").innerHTML = "The result is "+(x*y)
        }
    </script> 
</body>
</html>
