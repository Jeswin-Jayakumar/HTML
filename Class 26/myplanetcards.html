<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .planet-name {

font-size: 22px;

font-weight: bold;

color: rgb(115, 64, 40);

}

.planet-fact { color: rgb(145, 86, 27); margin-top: 10px; font-size: 14px; }
.card {background: burlywood;border: 3px solid saddlebrown; border-radius: 12px; padding: 20px;margin: 20px;}
    </style>
</head>
<body>
    <h1>My Planet Cards</h1>
    <button onclick="showPlanets()">Show Planets!</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class Planet { 
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }
        function showPlanets() {
            let p1 = new Planet("Earth","The only planet with life")
            let p2 = new Planet("Mars","The Red Planet")
            let p3 = new Planet("Saturn","It has rings made of ice")

            document.getElementById("card1").innerHTML =
            "<div class='card'><div class='planet-name'>" + p1.name + "</div>" +
            "<div class='planet-fact'>" + p1.describe() + "</div></div>";

            document.getElementById("card2").innerHTML =
            "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
            "<div class='planet-fact'>" + p2.describe() + "</div></div>";

            document.getElementById("card3").innerHTML =
            "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +
            "<div class='planet-fact'>" + p3.describe() + "</div></div>";
        }
    </script>
</body>
</html>
